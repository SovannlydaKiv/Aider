<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aider - Simple & Trusted Caregivers</title>
  </head>
  <body>
    <div id="app">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 1rem; color: #1a5c58; background: #fbfbfb;">
        <img src="/logo.png" alt="Aider" style="width: 64px; height: 64px; border-radius: 50%; object-fit: contain;" />
        <div style="width: 36px; height: 36px; border: 3.5px solid #fce9f1; border-top-color: #e879a0; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="font-weight: 700; font-size: 1.1rem; margin: 0;">Loading Aider…</p>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
